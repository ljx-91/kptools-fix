name: Build Y73S Android KPIMG (Arm GNU GCC 14.2)

'on':
  workflow_dispatch:
  push:
    branches:
      - y73s-gcc-audit-20261108
      - y73s-runtime-contract-hardening-20261108
      - y73s-dcache-coherency-20261108
      - y73s-cred-layout-guards-20261108
    # Exercises the credential-layout guard changes on this isolated branch.
    paths:
      - 'kernel/**'
      - 'scripts/**'
      - '.github/workflows/build-y73s-kpimg-gcc.yml'

permissions:
  contents: read

concurrency:
  group: y73s-gcc14-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y make python3 binutils xz-utils

      - name: Install Arm GNU Toolchain 14.2.rel1
        run: |
          set -euxo pipefail
          version=14.2.rel1
          archive="arm-gnu-toolchain-${version}-x86_64-aarch64-none-elf.tar.xz"
          url="https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/${version}/binrel/${archive}"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 -o "$archive" "$url"
          tar -xJf "$archive"
          gcc_path="$(find "arm-gnu-toolchain-${version}-x86_64-aarch64-none-elf" -type f -name aarch64-none-elf-gcc -print -quit)"
          test -n "$gcc_path"
          gcc_dir="$(cd "$(dirname "$gcc_path")" && pwd)"
          echo "$gcc_dir" >> "$GITHUB_PATH"
          "$gcc_path" --version

      - name: Build and audit Y73S KPIMG
        run: |
          set -euxo pipefail
          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1
          export Y73S_TARGET=1
          python3 -m py_compile scripts/*.py
          python3 scripts/test_aarch64_relocations.py
          python3 scripts/test_kpm_elf_headers.py
          python3 scripts/test_kpm_rela_transaction.py
          python3 scripts/test_kpm_setup_load_info.py
          python3 scripts/test_kpm_simplify_symbols.py
          python3 scripts/test_kpm_layout_copy.py
          python3 scripts/test_kpimg_kpm_loader.py
          python3 scripts/test_y73s_414_phys_fallback.py
          python3 scripts/test_y73s_414_supercall_abi.py
          python3 scripts/verify_y73s_414_kallsyms_profile.py
          cd kernel
          make clean
          make -j"$(nproc)" hdr kpimg
          test -s kpimg
          test -s kpimg.elf
          aarch64-none-elf-readelf -h kpimg.elf
          aarch64-none-elf-objdump -d --disassemble=_paging_init kpimg.elf
          aarch64-none-elf-objdump -d --disassemble=start kpimg.elf
          python3 ../scripts/verify_kpimg_elf_stack_frame.py kpimg.elf
          python3 ../scripts/verify_y73s_memblock_contract.py
          python3 ../scripts/verify_y73s_runtime_contract.py
          python3 ../scripts/verify_kpimg_map_relocation.py kpimg.elf
          python3 ../scripts/verify_y73s_fphook_contract.py
          python3 ../scripts/verify_lkm_hook_runtime_contract.py
          python3 ../scripts/verify_y73s_414_api_contract.py
          python3 ../scripts/verify_kpm_loader_contract.py
          python3 ../scripts/verify_kpm_lifecycle_contract.py
          python3 ../scripts/verify_userd_file_contract.py
          mkdir -p ../dist-y73s
          cp kpimg ../dist-y73s/kpimg-android
          cp kpimg.elf ../dist-y73s/kpimg-android.elf
          cp ../tools/preset.h ../dist-y73s/preset.h
          cp ../user/version ../dist-y73s/version
          cd ..
          (cd dist-y73s && sha256sum kpimg-android kpimg-android.elf preset.h version > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: y73s-kpimg-arm-gnu-gcc14-audit
          path: dist-y73s/
          if-no-files-found: error
          retention-days: 14
