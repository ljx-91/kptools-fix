name: Build Linux kptools for Y73S offline audit

on:
  push:
    branches:
      - y73s-dcache-coherency-20261108
      - y73s-cred-layout-guards-20261108
    paths:
      - 'tools/**'
      - 'scripts/**'
      - 'lkm/**'
      - '.github/workflows/build-y73s-kptools-host.yml'
      - y73s-cred-layout-guards-20261108

permissions:
  contents: read

jobs:

  audit-lkm-kpm-loader:
    name: Audit LKM KPM ELF loader source
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify LKM KPM ELF and relocation contracts
        run: |
          set -eux
          python3 -m py_compile scripts/verify_lkm_kpm_loader_contract.py scripts/verify_lkm_hook_runtime_contract.py scripts/verify_kpm_lifecycle_contract.py
          python3 scripts/verify_lkm_kpm_loader_contract.py
          python3 scripts/verify_lkm_hook_runtime_contract.py
          python3 scripts/verify_kpm_lifecycle_contract.py

  build-kptools:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev
      - name: Build host kptools
        run: |
          set -eux
          test -s tools/preset.h
          test -s version
          make -C tools -j"$(nproc)"
          test -s tools/kptools
          tools/kptools --version
          python3 scripts/verify_kpm_loader_contract.py
          python3 scripts/verify_bootimg_io_contract.py
          python3 scripts/verify_kptools_patch_bounds.py
      - name: Package
        run: |
          set -eux
          mkdir -p artifacts
          cp tools/kptools artifacts/kptools-linux-x86_64
          sha256sum artifacts/kptools-linux-x86_64 > artifacts/SHA256SUMS
          file artifacts/kptools-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: y73s-kptools-linux-x86_64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
