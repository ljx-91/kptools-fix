name: Build Linux kptools for Y73S offline audit

on:
  push:
    branches:
      - y73s-cred-layout-guards-20261108
      - y73s-dcache-coherency-20261108
    paths:
      - 'tools/**'
      - 'scripts/**'
      - 'lkm/**'
      - 'kernel/patch/**'
      - '.github/workflows/build-y73s-kptools-host.yml'

permissions:
  contents: read

jobs:

  audit-lkm-kpm-loader:
    name: Audit LKM KPM ELF loader source
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run repository-wide source contracts
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/*.py
          cc -std=gnu11 -Wall -Wextra -Werror -I kernel/include \
            scripts/test_y73s_hook_layout.c -o /tmp/test_y73s_hook_layout
          /tmp/test_y73s_hook_layout
          python3 scripts/test_aarch64_relocations.py
          python3 scripts/test_kpm_elf_headers.py
          python3 scripts/test_kpm_rela_transaction.py
          python3 scripts/test_kpm_setup_load_info.py
          python3 scripts/test_kpm_simplify_symbols.py
          python3 scripts/test_kpm_layout_copy.py
          python3 scripts/test_kpimg_kpm_loader.py
          python3 scripts/test_y73s_hook_gate_model.py
          python3 scripts/test_y73s_hook_gate_interleavings.py
          python3 scripts/verify_y73s_414_api_contract.py
          python3 scripts/verify_y73s_414_kallsyms_profile.py
          python3 scripts/verify_y73s_symbol_scan_and_startup_events.py
          for verifier in \
            verify_bootimg_io_contract.py \
            verify_kptools_patch_bounds.py \
            verify_kpm_loader_contract.py \
            verify_kpm_lifecycle_contract.py \
            verify_lkm_kpm_contract.py \
            verify_lkm_kpm_loader_contract.py \
            verify_lkm_hook_runtime_contract.py \
            verify_lkm_supercall_input_contract.py \
            verify_userd_file_contract.py \
            verify_y73s_fphook_contract.py \
            verify_y73s_memblock_contract.py \
            verify_y73s_runtime_contract.py \
            verify_y73s_syscall45_contract.py; do
            python3 "scripts/$verifier"
          done

  build-kptools:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev
      - name: Build host kptools
        run: |
          set -eux
          test -s tools/preset.h
          test -s version
          make -C tools -j"$(nproc)"
          test -s tools/kptools
          tools/kptools --version
          python3 scripts/verify_kpm_loader_contract.py
          python3 scripts/verify_bootimg_io_contract.py
          python3 scripts/verify_kptools_patch_bounds.py
      - name: Package
        run: |
          set -eux
          mkdir -p artifacts
          cp tools/kptools artifacts/kptools-linux-x86_64
          sha256sum artifacts/kptools-linux-x86_64 > artifacts/SHA256SUMS
          file artifacts/kptools-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: y73s-kptools-linux-x86_64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
