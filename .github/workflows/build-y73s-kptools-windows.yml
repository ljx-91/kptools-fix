name: Build Y73s Windows host kptools

on:
  workflow_dispatch:
  push:
    branches:
      - y73s-cred-layout-guards-20261108
    paths:
      - 'tools/**'
      - 'scripts/verify_bootimg_io_contract.py'
      - 'scripts/verify_kptools_patch_bounds.py'
      - 'scripts/test_kptools_bootimg_roundtrip.py'
      - '.github/workflows/build-y73s-kptools-windows.yml'
      - '.github/workflows/build-y73s-kpimg-gcc.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            mingw-w64-x86_64-make
            mingw-w64-x86_64-zlib
            python

      - name: Build and verify Windows kptools
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          make -C tools clean
          make -C tools -j"$(nproc)" LDFLAGS="-static -lz"
          test -s tools/kptools.exe
          tools/kptools.exe --version
          python scripts/verify_bootimg_io_contract.py
          python scripts/verify_kptools_patch_bounds.py
          python scripts/test_kptools_bootimg_roundtrip.py tools/kptools.exe
          file tools/kptools.exe
          objdump -f tools/kptools.exe | grep -E 'file format pei-x86-64|architecture: i386:x86-64'

      - name: Package Windows host tool
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp tools/kptools.exe artifacts/kptools-windows-x86_64.exe
          sha256sum artifacts/kptools-windows-x86_64.exe > artifacts/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/SOURCE_COMMIT.txt
          cat > artifacts/README.txt <<'EOF'
          Windows x86_64 host build of Y73s-adapted KernelPatch kptools.
          Built and round-trip tested from the recorded source commit.
          Pair this executable only with kpimg-android built from the exact same
          SOURCE_COMMIT.txt revision. The KPIMG artifact is published by the
          Y73s KPIMG workflow as a separate Actions artifact for that commit.
          This executable is not an Android device binary.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: kptools-windows-y73s
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
