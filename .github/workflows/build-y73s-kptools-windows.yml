name: Build Y73s Windows host kptools

on:
  workflow_dispatch:
  push:
    branches:
      - y73s-cred-layout-guards-20261108
    paths:
      - 'tools/**'
      - 'scripts/verify_bootimg_io_contract.py'
      - 'scripts/verify_kptools_patch_bounds.py'
      - '.github/workflows/build-y73s-kptools-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-zlib
            python

      - name: Build and verify Windows kptools
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          make -C tools clean
          make -C tools -j"$(nproc)" LDFLAGS="-static -lz"
          test -s tools/kptools.exe
          tools/kptools.exe --version
          python scripts/verify_bootimg_io_contract.py
          python scripts/verify_kptools_patch_bounds.py
          file tools/kptools.exe
          objdump -f tools/kptools.exe | grep -E 'file format pei-x86-64|architecture: i386:x86-64'

      - name: Package Windows host tool
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp tools/kptools.exe artifacts/kptools-windows-x86_64.exe
          sha256sum artifacts/kptools-windows-x86_64.exe > artifacts/SHA256SUMS.txt
          cat > artifacts/README.txt <<'EOF'
          Windows x86_64 host build of Y73s-adapted KernelPatch kptools.
          Built from the same repository commit as the matching Y73s KPIMG.
          Use this tool on Windows to inspect, patch, unpack, or repack Android boot images.
          Pair it only with kpimg-android from the same workflow run.
          This executable is not an Android device binary.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: kptools-windows-y73s
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
