
name: KernelPatch Windows Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-kpimg:
    name: Build Android kpimg on Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-none-elf \
            binutils-aarch64-none-elf \
            make \
            zlib1g-dev

      - name: Verify toolchain
        run: |
          set -eux
          aarch64-none-elf-gcc --version
          make --version

      - name: Build kpimg and generate headers
        shell: bash
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make -j"$(nproc)"

          test -s kpimg

          make hdr

          test -s ../tools/preset.h

      - name: Upload kpimg and generated headers
        uses: actions/upload-artifact@v4
        with:
          name: kpimg-and-headers
          path: |
            kernel/kpimg
            user/**
            tools/preset.h
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows kptools.exe
    runs-on: windows-latest
    needs: build-kpimg
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib

      - name: Download kpimg and generated headers
        uses: actions/download-artifact@v4
        with:
          name: kpimg-and-headers
          path: .

      - name: Verify downloaded files
        shell: msys2 {0}
        run: |
          set -eux

          test -s kernel/kpimg
          test -s tools/preset.h
          test -d user/uapi

          ls -lh kernel/kpimg
          ls -lh tools/preset.h

      - name: Build Windows kptools
        shell: msys2 {0}
        run: |
          set -eux

          export ANDROID=1

          cd tools

          make -j"$(nproc)"

          test -s kptools

      - name: Collect Windows artifacts
        shell: msys2 {0}
        run: |
          set -eux

          mkdir -p artifacts

          cp kernel/kpimg artifacts/kpimg-android
          cp tools/kptools artifacts/kptools.exe

          sha256sum artifacts/* > artifacts/SHA256SUMS

          ls -lh artifacts

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-Windows-Y73S
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
