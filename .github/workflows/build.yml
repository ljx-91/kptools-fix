
name: KernelPatch Windows Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'kernel/**'
      - 'tools/**'
      - 'patch/**'
      - 'version'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows kptools.exe
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib

      - name: Install AArch64 bare-metal toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "14.2.rel1"
          $name = "arm-gnu-toolchain-$version-mingw-w64-i686-aarch64-none-elf"

          $url = "https://developer.arm.com/-/media/Files/downloads/gnu/$version/binrel/$name.zip"

          Invoke-WebRequest -Uri $url -OutFile toolchain.zip

          Expand-Archive -Path toolchain.zip -DestinationPath "$env:RUNNER_TEMP\arm-toolchain" -Force

          $bin = "$env:RUNNER_TEMP\arm-toolchain\$name\bin"

          if (!(Test-Path "$bin\aarch64-none-elf-gcc.exe")) {
            throw "AArch64 GCC not found"
          }

          Add-Content $env:GITHUB_PATH $bin

      - name: Verify toolchain
        run: |
          set -eux
          aarch64-none-elf-gcc --version
          gcc --version
          make --version

      - name: Build kpimg
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make -j"$(nproc)"

          test -s kpimg

      - name: Generate kptools headers
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make hdr

      - name: Build Windows kptools
        run: |
          set -eux

          export ANDROID=1

          cd tools

          make -j"$(nproc)"

          test -s kptools

      - name: Collect artifacts
        run: |
          set -eux

          mkdir -p artifacts

          cp kernel/kpimg artifacts/kpimg-android
          cp tools/kptools artifacts/kptools.exe

          sha256sum artifacts/* > artifacts/SHA256SUMS

          ls -lh artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-Windows-Y73S
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
