
name: KernelPatch Windows Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Windows kptools.exe
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib

      - name: Install Arm AArch64 bare-metal toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "14.2.rel1"
          $filename = "arm-gnu-toolchain-$version-mingw-w64-i686-aarch64-none-elf.exe"

          $url = "https://developer.arm.com/-/media/Files/downloads/gnu/$version/binrel/$filename"
          $installer = "$env:RUNNER_TEMP\$filename"

          Write-Host "Downloading Arm toolchain..."
          Invoke-WebRequest -Uri $url -OutFile $installer

          Write-Host "Installing Arm toolchain silently..."
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S", "/P", "/R" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Arm toolchain installer failed: $($process.ExitCode)"
          }

          Write-Host "Searching for GCC installation..."

          $searchPaths = @(
            "C:\Program Files",
            "C:\Program Files (x86)"
          )

          $gcc = $null

          foreach ($root in $searchPaths) {
            if (Test-Path $root) {
              $gcc = Get-ChildItem `
                -Path $root `
                -Filter "aarch64-none-elf-gcc.exe" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($gcc) {
                break
              }
            }
          }

          if ($null -eq $gcc) {
            throw "aarch64-none-elf-gcc.exe not found after installation"
          }

          $gccBin = $gcc.Directory.FullName

          Write-Host "GCC found: $($gcc.FullName)"

          Add-Content $env:GITHUB_PATH $gccBin

          & $gcc.FullName --version

      - name: Verify toolchains
        shell: msys2 {0}
        run: |
          set -eux

          gcc --version
          make --version
          aarch64-none-elf-gcc --version

      - name: Build kpimg
        shell: msys2 {0}
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make -j"$(nproc)"

          test -s kpimg

      - name: Generate kptools headers
        shell: msys2 {0}
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make hdr

      - name: Build Windows kptools
        shell: msys2 {0}
        run: |
          set -eux

          export ANDROID=1

          cd tools

          # Do not call make clean in a fresh runner
          make -j"$(nproc)"

          test -s kptools

      - name: Collect artifacts
        shell: msys2 {0}
        run: |
          set -eux

          mkdir -p artifacts

          cp kernel/kpimg artifacts/kpimg-android
          cp tools/kptools artifacts/kptools.exe

          sha256sum artifacts/* > artifacts/SHA256SUMS

          ls -lh artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-Windows-Y73S
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
