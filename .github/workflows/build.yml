
name: KernelPatch Y73S Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build kpimg and kptools
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            make \
            zlib1g-dev \
            wget \
            tar \
            xz-utils \
            zip

      - name: Install AArch64 bare-metal toolchain
        shell: bash
        run: |
          set -eux

          TOOLCHAIN_VERSION=14.2.rel1
          TOOLCHAIN_NAME=arm-gnu-toolchain-${TOOLCHAIN_VERSION}-x86_64-aarch64-none-elf

          wget -q \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${TOOLCHAIN_VERSION}/binrel/${TOOLCHAIN_NAME}.tar.xz" \
            -O toolchain.tar.xz

          sudo mkdir -p /opt/arm-toolchain
          sudo tar -xf toolchain.tar.xz \
            -C /opt/arm-toolchain

          TOOLCHAIN_BIN="/opt/arm-toolchain/${TOOLCHAIN_NAME}/bin"

          echo "${TOOLCHAIN_BIN}" >> "$GITHUB_PATH"

          "${TOOLCHAIN_BIN}/aarch64-none-elf-gcc" --version

      - name: Build kpimg
        shell: bash
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make clean
          make -j"$(nproc)"

          test -f kpimg
          test -f kpimg.elf

      - name: Generate kptools headers
        shell: bash
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make hdr

      - name: Build kptools
        shell: bash
        run: |
          set -eux

          export ANDROID=1

          cd tools

          make clean
          make -j"$(nproc)"

          test -f kptools

      - name: Collect artifacts
        shell: bash
        run: |
          set -eux

          mkdir -p artifacts

          cp kernel/kpimg artifacts/kpimg-android
          cp kernel/kpimg.elf artifacts/kpimg-android.elf
          cp tools/kptools artifacts/kptools-linux

          sha256sum artifacts/* > artifacts/SHA256SUMS

          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-Y73S-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
