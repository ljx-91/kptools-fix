
name: KernelPatch Windows Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Windows kptools.exe
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib

      - name: Download Arm toolchain ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "14.2.rel1"
          $filename = "arm-gnu-toolchain-$version-mingw-w64-i686-aarch64-none-elf.zip"

          $url = "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/$version/binrel/$filename"

          $archive = "$env:RUNNER_TEMP\arm-toolchain.zip"

          Write-Host "Downloading: $filename"

          curl.exe `
            --fail `
            --location `
            --retry 3 `
            --connect-timeout 30 `
            --max-time 300 `
            "$url" `
            --output "$archive"

          if ($LASTEXITCODE -ne 0) {
            throw "Toolchain download failed"
          }

          if (!(Test-Path $archive)) {
            throw "Toolchain ZIP not found"
          }

          if ((Get-Item $archive).Length -lt 1000000) {
            throw "Toolchain ZIP is unexpectedly small"
          }

          Write-Host "Download complete"

      - name: Extract and configure Arm toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = "$env:RUNNER_TEMP\arm-toolchain.zip"
          $destination = "$env:RUNNER_TEMP\arm-toolchain"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force | Out-Null

          Write-Host "Extracting ZIP..."

          Expand-Archive `
            -Path $archive `
            -DestinationPath $destination `
            -Force

          Write-Host "Locating aarch64-none-elf-gcc.exe..."

          $gcc = Get-ChildItem `
            -Path $destination `
            -Filter "aarch64-none-elf-gcc.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if ($null -eq $gcc) {
            throw "aarch64-none-elf-gcc.exe not found"
          }

          $gccBin = $gcc.Directory.FullName

          Write-Host "GCC: $($gcc.FullName)"

          Add-Content $env:GITHUB_PATH $gccBin

          & $gcc.FullName --version

          if ($LASTEXITCODE -ne 0) {
            throw "GCC verification failed"
          }

      - name: Verify build environment
        shell: msys2 {0}
        run: |
          set -eux

          gcc --version
          make --version
          aarch64-none-elf-gcc --version

      - name: Build kpimg
        shell: msys2 {0}
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make -j"$(nproc)"

          test -s kpimg

          echo "kpimg build completed"

      - name: Generate kptools headers
        shell: msys2 {0}
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make hdr

      - name: Build Windows kptools
        shell: msys2 {0}
        run: |
          set -eux

          export ANDROID=1

          cd tools

          # Avoid make clean on a fresh build runner
          make -j"$(nproc)"

          test -s kptools

          file kptools

      - name: Collect artifacts
        shell: msys2 {0}
        run: |
          set -eux

          mkdir -p artifacts

          test -s kernel/kpimg
          test -s tools/kptools

          cp kernel/kpimg artifacts/kpimg-android
          cp tools/kptools artifacts/kptools.exe

          sha256sum artifacts/* > artifacts/SHA256SUMS

          ls -lh artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-Windows-Y73S
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
