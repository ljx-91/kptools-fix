
name: Build KernelPatch Y73S

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**.c'
      - '**.h'
      - Makefile
      - CMakeLists.txt
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld cmake ninja-build zlib1g-dev git python3

      - name: Build
        run: |
          set -eux
          if [ -f build.sh ]; then
            chmod +x build.sh
            ./build.sh
          elif [ -f Makefile ]; then
            make -j"$(nproc)"
          elif [ -f CMakeLists.txt ]; then
            cmake -S . -B build -G Ninja
            cmake --build build --parallel
          else
            echo "Build entry not found"
            exit 1
          fi

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find . -type f \( -name "kptools" -o -name "kpimg-android" -o -name "kpimg" \) -not -path "./.git/*" -not -path "./artifacts/*" -exec cp --parents {} artifacts/ \;

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-Y73S-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
