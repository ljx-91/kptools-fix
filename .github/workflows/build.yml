
name: KernelPatch Windows Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - y73s-gcc-audit-20261108
      - y73s-cred-layout-guards-20261108

permissions:
  contents: read

jobs:
  build-kpimg:
    name: Build Android kpimg on Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify independent LKM KPM loader contract
        shell: bash
        run: |
          set -eux
          python3 scripts/verify_lkm_kpm_contract.py

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            curl \
            xz-utils \
            zlib1g-dev

      - name: Download Arm AArch64 toolchain
        shell: bash
        run: |
          set -eux

          VERSION="14.2.rel1"
          FILE="arm-gnu-toolchain-${VERSION}-x86_64-aarch64-none-elf.tar.xz"

          URL="https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/${VERSION}/binrel/${FILE}"

          mkdir -p "$HOME/arm-toolchain"

          curl --fail --location --retry 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "$URL" \
            -o "$HOME/arm-toolchain.tar.xz"

          test -s "$HOME/arm-toolchain.tar.xz"

          tar -xJf "$HOME/arm-toolchain.tar.xz" \
            -C "$HOME/arm-toolchain"

          GCC="$(find "$HOME/arm-toolchain" \
            -type f \
            -name aarch64-none-elf-gcc \
            -print -quit)"

          if [ -z "$GCC" ]; then
            echo "ERROR: aarch64-none-elf-gcc not found"
            exit 1
          fi

          GCC_BIN="$(dirname "$GCC")"

          echo "$GCC_BIN" >> "$GITHUB_PATH"

          "$GCC" --version

      - name: Verify toolchain
        shell: bash
        run: |
          set -eux

          aarch64-none-elf-gcc --version
          aarch64-none-elf-ld --version
          make --version

      - name: Build Android kpimg
        shell: bash
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1
          if [ "${GITHUB_REF_NAME}" = "y73s-gcc-audit-20261108" ] ||
             [ "${GITHUB_REF_NAME}" = "y73s-cred-layout-guards-20261108" ]; then
            export Y73S_TARGET=1
          fi

          cd kernel

          # Build only the ARM64 kpimg target.
          # Do not build the default all target.
          make -j"$(nproc)" kpimg

          test -s kpimg
          test -s kpimg.elf

          # Keep compiler-specific frame evidence in the job log when the
          # verifier rejects a new GCC/toolchain code-generation pattern.
          echo "===== _paging_init disassembly ====="
          aarch64-none-elf-objdump -d --disassemble=_paging_init kpimg.elf
          echo "===== start disassembly ====="
          aarch64-none-elf-objdump -d --disassemble=start kpimg.elf

          python3 ../scripts/verify_kpimg_elf_stack_frame.py kpimg.elf
          python3 ../scripts/verify_kpimg_map_relocation.py kpimg.elf

          echo "Y73S KPIMG build and ELF/map relocation verification successful"

      - name: Generate kptools headers
        shell: bash
        run: |
          set -eux

          export TARGET_COMPILE=aarch64-none-elf-
          export ANDROID=1

          cd kernel

          make hdr

          test -s ../tools/preset.h
          test -d ../user/uapi
          test -s ../user/version

      - name: Build Linux kptools and run source contracts
        shell: bash
        run: |
          set -euxo pipefail

          make -C tools -j"$(nproc)"
          test -s tools/kptools
          tools/kptools --version

          python3 -m py_compile scripts/*.py
          python3 scripts/test_y73s_hook_gate_model.py
          for verifier in \
            verify_bootimg_io_contract.py \
            verify_kptools_patch_bounds.py \
            verify_kpm_loader_contract.py \
            verify_kpm_lifecycle_contract.py \
            verify_lkm_kpm_contract.py \
            verify_lkm_kpm_loader_contract.py \
            verify_lkm_hook_runtime_contract.py \
            verify_lkm_supercall_input_contract.py \
            verify_userd_file_contract.py \
            verify_y73s_fphook_contract.py \
            verify_y73s_memblock_contract.py \
            verify_y73s_runtime_contract.py; do
            python3 "scripts/$verifier"
          done

      - name: Package kpimg and headers
        shell: bash
        run: |
          set -eux

          mkdir -p artifact/kernel
          mkdir -p artifact/user/uapi
          mkdir -p artifact/tools

          cp kernel/kpimg artifact/kernel/kpimg
          cp -R user/uapi/. artifact/user/uapi/
          cp user/version artifact/user/version
          cp tools/preset.h artifact/tools/preset.h
          cp tools/kptools artifact/tools/kptools-linux-x86_64

          find artifact -type f -print

      - name: Upload kpimg and headers
        uses: actions/upload-artifact@v4
        with:
          name: kpimg-and-headers
          path: artifact/
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows kptools.exe
    runs-on: windows-latest
    needs: build-kpimg
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib

      - name: Download kpimg and headers
        uses: actions/download-artifact@v4
        with:
          name: kpimg-and-headers
          path: .

      - name: Verify downloaded files
        shell: msys2 {0}
        run: |
          set -eux

          test -s kernel/kpimg
          test -s tools/preset.h
          test -s user/version
          test -d user/uapi

          ls -lh kernel/kpimg
          ls -lh tools/preset.h

      - name: Build Windows kptools
        shell: msys2 {0}
        run: |
          set -eux

          export ANDROID=1

          cd tools

          make -j"$(nproc)"

          test -s kptools.exe

          echo "Windows kptools build successful"

      - name: Smoke-test Windows executable
        shell: msys2 {0}
        run: |
          set -eux
          tools/kptools.exe --version

      - name: Collect and package Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item kernel/kpimg artifacts/kpimg-android
          Copy-Item tools/kptools.exe artifacts/kptools.exe

          @'
          KernelPatch Windows tools - vivo Y73s branch
          ============================================

          Target branch: y73s-cred-layout-guards-20261108
          Build: GitHub Actions / Windows x64
          Contents:
            kptools.exe     Windows x64 command-line tool
            kpimg-android   ARM64 Android kpimg built by the paired Ubuntu job
            SHA256SUMS      SHA-256 checksums

          Quick start (PowerShell or CMD):
            .\kptools.exe --version
            .\kptools.exe --help

          Run commands from this directory, or provide the full path to the
          executable. Keep kpimg-android alongside the package when using
          workflows that require the Android kpimg payload.

          IMPORTANT Y73s / AVB STATUS
          This package is a build artifact, not a device-validated release.
          Modified boot images have NOT been proven to pass the OEM Y73s AVB
          boot HashDescriptor check. Do not flash or boot a modified image
          based solely on successful compilation, packaging, or RSA signature
          verification. No Fastboot, partition write, or device boot test is
          implied by this artifact.
          '@ | Set-Content -Encoding utf8 artifacts/README-Windows.txt

          @'
          @echo off
          "%~dp0kptools.exe" %*
          '@ | Set-Content -Encoding ascii artifacts/kptools-help.cmd

          $files = Get-ChildItem artifacts -File | Where-Object { $_.Name -ne "SHA256SUMS" -and $_.Name -ne "KernelPatch-Windows-Y73S.zip" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii artifacts/SHA256SUMS

          Compress-Archive -Path artifacts/kptools.exe,artifacts/kpimg-android,artifacts/README-Windows.txt,artifacts/kptools-help.cmd,artifacts/SHA256SUMS -DestinationPath KernelPatch-Windows-Y73S.zip -Force
          Get-FileHash -Algorithm SHA256 KernelPatch-Windows-Y73S.zip
          Get-ChildItem artifacts,KernelPatch-Windows-Y73S.zip | Format-Table FullName,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-Windows-Y73S
          path: |
            artifacts/
            KernelPatch-Windows-Y73S.zip
          if-no-files-found: error
          retention-days: 14
