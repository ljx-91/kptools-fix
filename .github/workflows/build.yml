
name: Build KernelPatch Y73S

on:
  workflow_dispatch:
  push:
    branches:
      - main
    - master
    paths:
      - "**.c"
      - "**.h"
      - "Makefile"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            cmake \
            ninja-build \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            zlib1g-dev \
            git \
            python3

      - name: Show environment
        run: |
          uname -a
          gcc --version
          clang --version
          cmake --version

      - name: Build KernelPatch
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build.sh 2>/dev/null || true

          if [ -f build.sh ]; then
            ./build.sh
          elif [ -f Makefile ]; then
            make -j"$(nproc)"
          elif [ -f CMakeLists.txt ]; then
            cmake -S . -B build -G Ninja
            cmake --build build --parallel
          else
            echo "No recognized build entry point found."
            exit 1
          fi

      - name: Collect build artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts

          find . -type f \
            \( -name "kptools" \
            -o -name "kptools.exe" \
            -o -name "kpimg-android" \
            -o -name "kpimg" \
            -o -name "*.elf" \
            -o -name "*.bin" \) \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            -exec cp --parents {} artifacts/ \;

          echo "Collected files:"
          find artifacts -type f

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-Y73S-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-build-logs
          path: |
            build/
            CMakeFiles/
          if-no-files-found: ignore
          retention-days: 7
