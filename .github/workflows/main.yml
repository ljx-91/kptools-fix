
name: Build KernelPatch Y73S

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld cmake ninja-build zlib1g-dev

      - name: Build
        run: |
          set -eux
          if [ -f build.sh ]; then
            bash build.sh
          elif [ -f Makefile ]; then
            make -j"$(nproc)"
          elif [ -f CMakeLists.txt ]; then
            cmake -S . -B build -G Ninja
            cmake --build build --parallel
          else
            echo "No build script found"
            exit 1
          fi

      - name: Upload build files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KernelPatch-Y73S
          path: |
            build/
            kptools
            kpimg-android
          if-no-files-found: warn
          retention-days: 14
