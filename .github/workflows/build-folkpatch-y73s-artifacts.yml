name: Build combined Y73s FolkPatch artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - y73s-cred-layout-guards-20261108
    paths:
      - 'tools/**'
      - 'kernel/**'
      - 'scripts/**'
      - 'user/version'
      - '.github/workflows/build-folkpatch-y73s-artifacts.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make zlib1g-dev python3 binutils xz-utils zip

      # sdkmanager 16.x requires JDK 17+; ubuntu-22.04 may expose JDK 11 by default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          set -euxo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/commandlinetools-linux.zip"
          extract="$RUNNER_TEMP/android-cmdline-tools"
          mkdir -p "$sdk_root/cmdline-tools" "$extract"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$archive"
          python3 -m zipfile -e "$archive" "$extract"
          test -f "$extract/cmdline-tools/bin/sdkmanager"
          chmod +x "$extract/cmdline-tools/bin/"*
          mv "$extract/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses || test -s "$sdk_root/licenses/android-sdk-license"

      - name: Install pinned Android NDK
        run: |
          set -eux
          sdkmanager --install "ndk;30.0.15729638"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" >> "$GITHUB_ENV"

      - name: Install Rust and cargo-ndk
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" install cargo-ndk --locked
          "$HOME/.cargo/bin/cargo" ndk --version

      - name: Install Arm GNU Toolchain 14.2.rel1
        run: |
          set -euxo pipefail
          version=14.2.rel1
          archive="arm-gnu-toolchain-${version}-x86_64-aarch64-none-elf.tar.xz"
          url="https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/${version}/binrel/${archive}"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 -o "$archive" "$url"
          tar -xJf "$archive"
          gcc_path="$(find "arm-gnu-toolchain-${version}-x86_64-aarch64-none-elf" -type f -name aarch64-none-elf-gcc -print -quit)"
          test -n "$gcc_path"
          gcc_dir="$(cd "$(dirname "$gcc_path")" && pwd)"
          echo "$gcc_dir" >> "$GITHUB_PATH"
          "$gcc_path" --version

      - name: Run FolkPatch and Y73s regression tests
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/*.py
          python3 scripts/test_kptools_extra_terminator.py
          python3 scripts/test_y73s_kallsym_pid_vnr_cfi.py
          python3 scripts/test_folkpatch_trusted_manager.py
          python3 scripts/test_y73s_manager_uid_refresh.py
          python3 scripts/verify_userd_file_contract.py
          python3 scripts/verify_y73s_414_kallsyms_profile.py
          python3 scripts/verify_y73s_symbol_scan_and_startup_events.py
          python3 scripts/test_aarch64_relocations.py
          python3 scripts/test_kpm_elf_headers.py
          python3 scripts/test_kpm_rela_transaction.py
          python3 scripts/test_kpm_setup_load_info.py
          python3 scripts/test_kpm_simplify_symbols.py
          python3 scripts/test_kpm_layout_copy.py
          python3 scripts/test_kpimg_kpm_loader.py

      - name: Build and verify host kptools
        run: |
          set -euxo pipefail
          make -C tools clean
          make -C tools -j"$(nproc)"
          tools/kptools --version
          python3 scripts/verify_bootimg_io_contract.py
          python3 scripts/verify_kptools_patch_bounds.py

      - name: Build Android ARM64 kptools
        run: |
          set -euxo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android26-clang"
          make -C tools clean
          make -C tools -j"$(nproc)" \
            CC="$TOOLCHAIN/aarch64-linux-android26-clang" \
            CPPFLAGS="-D_GNU_SOURCE -fPIE" \
            LDFLAGS="-pie -Wl,--build-id=sha1 -lz"
          test -s tools/kptools
          file tools/kptools
          readelf -h tools/kptools | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          readelf -l tools/kptools | grep -F '/system/bin/linker64'
          strings tools/kptools | grep -F 'pid_vnr is CFI stub, follow branch to offset'
          strings tools/kptools | grep -F 'strict vector validation'

      - name: Build Y73s KPIMG
        env:
          TARGET_COMPILE: aarch64-none-elf-
          ANDROID: '1'
          Y73S_TARGET: '1'
        run: |
          set -euxo pipefail
          cd kernel
          make clean
          make -j"$(nproc)" hdr kpimg
          test -s kpimg
          test -s kpimg.elf
          aarch64-none-elf-readelf -h kpimg.elf
          aarch64-none-elf-objdump -d --disassemble=_paging_init kpimg.elf
          aarch64-none-elf-objdump -d --disassemble=start kpimg.elf
          python3 ../scripts/verify_kpimg_elf_stack_frame.py kpimg.elf
          python3 ../scripts/verify_kpimg_map_relocation.py kpimg.elf

      - name: Package one-revision FolkPatch artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp tools/kptools artifacts/kptools-android
          chmod 0755 artifacts/kptools-android
          cp kernel/kpimg artifacts/kpimg-android
          cp kernel/kpimg.elf artifacts/kpimg-android.elf
          cp tools/preset.h artifacts/preset.h
          cp user/version artifacts/version
          cat > artifacts/README-FOLKPATCH-Y73S.txt <<'EOF'
          Y73S-specific FolkPatch 115404 KernelPatch artifacts.
          kptools-android is an Android ARM64 PIE executable. FolkPatch stores it
          as app/libs/arm64-v8a/libkptools.so, then copies and executes it.
          kpimg-android is the matching Y73S KP payload. Both files were built
          from the same repository commit; do not mix with artifacts from another run.
          The trusted manager is the official me.yuki.folk package signed by the
          certificate in FolkPatch_0f3f42ba.apk.
          EOF
          sha256sum artifacts/kptools-android artifacts/kpimg-android artifacts/kpimg-android.elf artifacts/preset.h artifacts/version > artifacts/SHA256SUMS
          (cd artifacts && zip -q FolkPatch-Y73S-artifacts.zip kptools-android kpimg-android kpimg-android.elf preset.h version SHA256SUMS README-FOLKPATCH-Y73S.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: folkpatch-y73s-kernelpatch-artifacts
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  build-patch-only-apk:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LyraVoid/FolkPatch
          ref: 0f3f42ba02d6441dbbeb247f34c0f5eabc14e393
          path: FolkPatch
          fetch-depth: 0
          submodules: recursive

      - name: Give the source checkout a stable branch name
        working-directory: FolkPatch
        run: git switch -c folkpatch-y73s-patcher

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: FolkPatch/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK command-line tools
        run: |
          set -euxo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/commandlinetools-linux.zip"
          extract="$RUNNER_TEMP/android-cmdline-tools"
          mkdir -p "$sdk_root/cmdline-tools" "$extract"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$archive"
          python3 -m zipfile -e "$archive" "$extract"
          test -f "$extract/cmdline-tools/bin/sdkmanager"
          chmod +x "$extract/cmdline-tools/bin/"*
          mv "$extract/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses || test -s "$sdk_root/licenses/android-sdk-license"

      - name: Install FolkPatch Android SDK components
        run: |
          set -eux
          # Google has not published an android-37 SDK platform in the
          # stable repository. Compile against the available API 36 platform.
          # AAR metadata is checked separately; the build step below excludes
          # only that metadata gate and still requires real Kotlin/Java/C++
          # compilation to succeed. Runtime compatibility must be reviewed.
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;30.0.15729638" \
            "cmake;3.31.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.15729638" >> "$GITHUB_ENV"

      # This is a separate job from the kernel/KPIMG build above. Install
      # Rust and cargo-ndk here as well; PATH changes do not cross job boundaries.
      - name: Install Rust target and cargo-ndk for APK sidecar
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/rustup" target add aarch64-linux-android
          "$HOME/.cargo/bin/cargo" install cargo-ndk --locked
          "$HOME/.cargo/bin/cargo" ndk --version
          test -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

      - uses: actions/download-artifact@v4
        with:
          name: folkpatch-y73s-kernelpatch-artifacts
          path: artifacts

      - name: Configure side-by-side patch-only application
        run: |
          set -eux
          sed -i 's/applicationId = "me.yuki.folk"/applicationId = "me.yuki.folk.y73s.patcher"/' FolkPatch/app/build.gradle.kts
          sed -i 's/project.ext.set("kernelPatchVersion", "0.13.9")/project.ext.set("kernelPatchVersion", "0.13.9")/' FolkPatch/build.gradle.kts
          # Compile against the available API 36 platform; keep targetSdk 36.
          sed -i 's/androidCompileSdkVersion by extra(37)/androidCompileSdkVersion by extra(36)/' FolkPatch/build.gradle.kts
          grep -F 'androidCompileSdkVersion by extra(36)' FolkPatch/build.gradle.kts
          sed -i 's/android:label="FolkPatch"/android:label="FolkPatch Y73s Patcher"/' FolkPatch/app/src/main/AndroidManifest.xml
          grep -F 'applicationId = "me.yuki.folk.y73s.patcher"' FolkPatch/app/build.gradle.kts
          grep -F 'kernelPatchVersion", "0.13.9"' FolkPatch/build.gradle.kts

      - name: Build FolkPatch Y73s patcher APK
        working-directory: FolkPatch
        run: |
          set -euxo pipefail
          # Exclude the AAR metadata task by task name across all Android modules;
          # the previous app-only path left :core:designsystem:checkDebugAarMetadata active.
          # This remains diagnostic only: successful compilation must be followed by
          # inspection of API-37 references and runtime compatibility.
          # AGP's BundleAar task declares the metadata-check output directory as
          # an input even when the check task is excluded. Pre-create the expected
          # empty directories for every Gradle subproject so task input validation
          # does not fail after successful source compilation.
          while IFS= read -r build_file; do
            project_dir="$(dirname "$build_file")"
            mkdir -p "$project_dir/build/intermediates/aar_metadata_check/debug/checkDebugAarMetadata"
          done < <(find . -name build.gradle.kts -not -path './.gradle/*' -not -path '*/build/*')
          ./gradlew --no-daemon assembleDebug -x checkDebugAarMetadata -PkernelPatchArtifacts="${GITHUB_WORKSPACE}/artifacts"
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p "${GITHUB_WORKSPACE}/patcher-apk"
          cp "$apk" "${GITHUB_WORKSPACE}/patcher-apk/FolkPatch-Y73s-Patcher.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: folkpatch-y73s-patcher-apk
          path: patcher-apk/FolkPatch-Y73s-Patcher.apk
          if-no-files-found: error
          retention-days: 14
